<!DOCTYPE html>
<html lang="pt-br">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Perguntas Frequentes - Casa Nostra</title>
    <link rel="icon" href="../img/Logo.jpg">
    <link rel="stylesheet" href="../css/fonts.css">
    <link rel="stylesheet" href="../css/base.css">
    <link rel="stylesheet" href="../css/faq.css">
    <link rel="stylesheet" href="../css/extras.css">
    <script src="../js/faq.js" defer></script>
    <script src="../js/extras.js" defer></script>
</head>
<body>
    <header>
        <img src="../img/Logo.jpg" alt="Logo Casa Nostra">
        <div class="paginas" id="menu-principal">
            <nav>
                <ul>
                    <li>
                        <a href="../html/home.html">Início</a>
                    </li>
                    <li>
                        <a href="../html/sobre.html">Sobre nós</a>
                    </li>
                    <li>
                        <a href="../html/localizacao.html">Localização</a>
                    </li>
                    <li>
                        <a href="../html/faq.html">FAQs</a>
                    </li>
                </ul>
            </nav>
        </div>
        <button class="menu-toggle" aria-label="Abrir Menu" aria-expanded="false" aria-controls="menu-principal">☰</button>
    </header>
    <main>
        <section class="faq-section">
            <h1 class="faq-titulo">Perguntas Frequentes</h1>

            <div class="adicionar-card">
                <h2>Adicionar nova dúvida</h2>
                <form id="form-nova-pergunta">
                    <label for="nova-pergunta">Pergunta</label>
                    <input type="text" id="nova-pergunta" placeholder="Digite sua pergunta" required>

                    <label for="nova-resposta">Resposta</label>
                    <textarea id="nova-resposta" placeholder="Digite a resposta" rows="4" required></textarea>

                    <button type="submit" class="btn-adicionar">Adicionar</button>
                </form>
            </div>

            <div class="perguntas_frequentes" id="lista-faqs"></div>
        </section>
    </main>
    <footer>
        <div class="rodape">
            <div class="contato">
                <a href="https://www.instagram.com/casanostra/" target="_blank" rel="noopener noreferrer">
                    <img src="../img/insta_sem_fundo.png" alt="Instagram">
                </a>
                <a href="https://www.facebook.com/?locale=pt_BR" target="_blank" rel="noopener noreferrer">
                    <img src="../img/face_sem_fundo.png" alt="Facebook">
                </a>
            </div>
        </div>
        <p>Terça à Quinta e Domingo: 17:00 às 23:00 ° Sexta e Sábado: 17:00 às 00:00</p>
        <p id="status-funcionamento"></p>
    </footer>
</body>
</html>
